<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mandarin Quiz</title>
<meta name="description" content="Create Mandarin quizzes from AI-generated JSON and review your students' results." />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script>
  // Applied before first paint so the page never flashes the default
  // theme and then switches - see js/app.js for the switcher itself.
  (function () {
    var saved = localStorage.getItem('appTheme');
    if (saved && saved !== 'ink-seal') document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="brand" onclick="go('')">
      <span class="brand-mark">卷</span>
      <span class="brand-text">
        <strong>Mandarin Quiz</strong>
        <span>a quiet corner for class results</span>
      </span>
    </a>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <main id="main"></main>
  <footer class="hint">Runs on your own server &middot; student names only, no accounts</footer>
</div>

<script src="js/icons.js"></script>
<script src="js/prompt.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
